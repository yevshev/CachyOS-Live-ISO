name: Jay + Noctalia Desktop ISO
on:
  push:
    branches:
    - master
    - jay-noctalia
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    name: Build
    outputs:
      builddate: ${{ steps.date.outputs.builddate }}
    steps:
      - name: Verify x86-64-v4 (AVX-512) CPU support
        id: cpu-check
        run: |
          for flag in avx512f avx512bw avx512cd avx512dq avx512vl; do
            if ! grep -qw "$flag" /proc/cpuinfo; then
              echo "::error::Build host CPU lacks required x86-64-v4 flag '$flag'; cannot run znver4 chroot hooks."
              exit 1
            fi
          done

      - name: Get build date
        id: date
        run: |
          echo "builddate=$(date +'%y%m%d')" >> $GITHUB_OUTPUT

      - name: Clone CachyOS-Live-ISO
        id: clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add CachyOS keyring
        id: keyring
        run: |
          pacman-key --init
          pacman-key --recv-keys 882DCFE48E2051D48E2562ABF3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47

          sed -i '/^\[core\]$/i[cachyos]\nServer = https://cdn77.cachyos.org/repo/$arch/$repo\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf

      - name: Install dependencies
        id: dependencies
        run: |
          sudo pacman -Syu --noconfirm archiso cachyos-keyring mkinitcpio-archiso squashfs-tools

      - name: Create build user
        id: user-archiso
        run: |
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build ISO (${{ steps.date.outputs.builddate }})
        id: build
        run: |
          sudo -H -E -u builder ./buildiso.sh

      - name: Upload ISO to artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-jay-noctalia-linux-${{ steps.date.outputs.builddate }}
          path: out/desktop/*
