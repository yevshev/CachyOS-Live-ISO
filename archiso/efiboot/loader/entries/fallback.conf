title   CachyOS %ARCH% Fallback (nomodeset)
sort-key  C
linux   /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
initrd  /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=16G copytoram=y module_blacklist=pcspkr nomodeset nvme_load=yes
