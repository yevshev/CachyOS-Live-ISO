title   CachyOS %ARCH% UEFI Default
sort-key A
linux   /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
initrd  /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=16G copytoram=y module_blacklist=pcspkr amdgpu.modeset=1 nvme_load=yes amd_iommu=force_isolation iommu=force iommu.strict=1 iommu.passthrough=0 init_on_alloc=1 init_on_free=1 slab_nomerge page_alloc.shuffle=1 vsyscall=none debugfs=off randomize_kstack_offset=on nowatchdog nmi_watchdog=0 transparent_hugepage_shmem=within_size
