# Hard-disable unused wireless and Bluetooth kernel subsystems
blacklist mt7921e
blacklist mt7921_common
blacklist mt792x_lib
blacklist mt7925e
blacklist iwlwifi
blacklist cfg80211
blacklist mac80211
blacklist bluetooth
blacklist btusb
blacklist btrtl
blacklist btmtk
blacklist btintel
blacklist btbcm
blacklist bnep
blacklist rfcomm
blacklist hidp

install mt7921e /bin/false
install mt7921_common /bin/false
install mt792x_lib /bin/false
install mt7925e /bin/false
install iwlwifi /bin/false
install cfg80211 /bin/false
install mac80211 /bin/false
install bluetooth /bin/false
install btusb /bin/false
install btrtl /bin/false
install btmtk /bin/false
install btintel /bin/false
install btbcm /bin/false
install bnep /bin/false
install rfcomm /bin/false
install hidp /bin/false

# Block AF_BLUETOOTH protocol auto-loading
alias net-pf-31 off
