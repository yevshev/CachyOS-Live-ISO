#!/usr/bin/nft -f
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    iif != "lo" ip daddr 127.0.0.0/8 drop
    iif != "lo" ip6 daddr ::1 drop

    ct state invalid drop
    ct state { established, related } accept

    # RFC 4861 IPv6 Neighbor Discovery (defense-in-depth hoplimit 255)
    ip6 hoplimit 255 ip6 saddr fe80::/10 icmpv6 type nd-router-advert accept
    ip6 hoplimit 255 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert } accept

    # Scope DHCPv4 strictly to IPv4 and DHCPv6 to link-local
    meta nfproto ipv4 udp sport 67 udp dport 68 accept
    ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;

    # Allow local stub resolver (127.0.0.53:53), block outbound plaintext DNS leaks
    oif "lo" accept
    meta l4proto { tcp, udp } th dport 53 reject
  }
}
